<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Runi Store Asset Frame</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang SC", "Microsoft YaHei", sans-serif;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: #f8fbff;
        background:
          radial-gradient(circle at 83% 5%, rgb(63 146 255 / 28%), transparent 31%),
          radial-gradient(circle at 10% 92%, rgb(25 201 170 / 17%), transparent 27%),
          linear-gradient(145deg, #07132f 0%, #0a2552 54%, #0d3265 100%);
      }

      .shot {
        position: relative;
        width: 1280px;
        height: 800px;
        padding: 42px 64px 50px;
      }

      .shot::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        background-image:
          linear-gradient(rgb(255 255 255 / 3%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 3%) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: linear-gradient(to bottom, black, transparent 75%);
      }

      .brand {
        position: relative;
        z-index: 2;
        display: flex;
        gap: 12px;
        align-items: center;
        height: 38px;
        font-size: 20px;
        font-weight: 720;
        letter-spacing: -0.02em;
      }

      .brand img {
        width: 36px;
        height: 36px;
        border-radius: 9px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 24%);
      }

      .copy {
        position: absolute;
        z-index: 2;
        top: 92px;
        left: 64px;
      }

      h1 {
        max-width: 930px;
        margin: 0;
        font-size: 44px;
        line-height: 1.06;
        letter-spacing: -0.045em;
      }

      .subtitle {
        margin: 10px 0 0;
        color: #cbdcf7;
        font-size: 19px;
        font-weight: 480;
        letter-spacing: -0.012em;
      }

      .capture {
        position: absolute;
        z-index: 2;
        top: 205px;
        left: 64px;
        width: 1152px;
        height: 545px;
        overflow: hidden;
        border: 1px solid rgb(207 227 255 / 44%);
        border-radius: 22px;
        background: #eef6f1;
        box-shadow:
          0 26px 80px rgb(0 4 18 / 42%),
          0 2px 0 rgb(255 255 255 / 30%) inset;
      }

      .capture::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        border: 1px solid rgb(255 255 255 / 36%);
        border-radius: inherit;
      }

      .mock-browser {
        width: 100%;
        height: 100%;
        color: #1f2937;
        background: #f7f8fb;
      }

      .mock-toolbar {
        display: flex;
        gap: 7px;
        align-items: center;
        height: 38px;
        padding: 0 15px;
        color: #718096;
        font-size: 11px;
        font-weight: 650;
        border-bottom: 1px solid #dbe2ea;
        background: #edf1f6;
      }

      .mock-toolbar i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #94a3b8;
      }

      .mock-address {
        min-width: 245px;
        margin-left: 8px;
        padding: 5px 12px;
        border: 1px solid #d5dde7;
        border-radius: 999px;
        background: #fff;
      }

      .mock-content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 390px;
        height: calc(100% - 38px);
      }

      .mock-page {
        position: relative;
        overflow: hidden;
        padding: 38px 46px;
        border-right: 1px solid #dce3ec;
        background:
          radial-gradient(circle at 88% 7%, rgb(91 111 240 / 11%), transparent 31%),
          linear-gradient(160deg, #fffdf9, #f4faf8);
      }

      .mock-kicker {
        margin: 0 0 13px;
        color: #0e766e;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .mock-page h2 {
        max-width: 540px;
        margin: 0;
        color: #172b35;
        font-size: 35px;
        line-height: 1.06;
        letter-spacing: -0.045em;
      }

      .mock-page-lede {
        max-width: 560px;
        margin: 15px 0 0;
        color: #607075;
        font-size: 14px;
        line-height: 1.65;
      }

      .mock-cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 30px;
      }

      .mock-card {
        min-height: 108px;
        padding: 17px;
        border: 1px solid #dfe7e4;
        border-radius: 16px;
        background: rgb(255 255 255 / 82%);
        box-shadow: 0 12px 28px rgb(32 75 71 / 6%);
      }

      .mock-card strong {
        display: block;
        margin-bottom: 9px;
        color: #1f3d42;
        font-size: 13px;
      }

      .mock-card span {
        color: #718184;
        font-size: 11px;
        line-height: 1.48;
      }

      .mock-progress {
        margin-top: 20px;
        padding: 18px;
        color: #e6fffa;
        border-radius: 16px;
        background: #17383d;
      }

      .mock-progress-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 12px;
        font-weight: 700;
      }

      .mock-progress-track {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(255 255 255 / 14%);
      }

      .mock-progress-track::after {
        display: block;
        width: 72%;
        height: 100%;
        content: "";
        border-radius: inherit;
        background: linear-gradient(90deg, #22d3ee, #8b5cf6);
      }

      .mock-settings-card {
        margin-top: 24px;
        padding: 20px;
        border: 1px solid #dfe5ec;
        border-radius: 17px;
        background: rgb(255 255 255 / 90%);
      }

      .mock-setting-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        font-size: 13px;
        font-weight: 760;
      }

      .mock-badge {
        padding: 4px 8px;
        color: #4f46e5;
        font-size: 10px;
        border-radius: 999px;
        background: #eef2ff;
      }

      .mock-field {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 13px;
        align-items: center;
        margin-top: 10px;
        color: #64748b;
        font-size: 11px;
      }

      .mock-field span:last-child {
        padding: 8px 10px;
        color: #475569;
        border: 1px solid #dce3eb;
        border-radius: 9px;
        background: #f8fafc;
      }

      .mock-panel {
        display: flex;
        min-width: 0;
        flex-direction: column;
        background: #fff;
      }

      .mock-panel-header {
        display: flex;
        gap: 9px;
        align-items: center;
        height: 50px;
        padding: 0 16px;
        color: #111827;
        font-size: 13px;
        font-weight: 760;
        border-bottom: 1px solid #e5e7eb;
      }

      .mock-panel-header img {
        width: 29px;
        height: 29px;
        border-radius: 8px;
      }

      .mock-panel-header small {
        margin-left: auto;
        color: #94a3b8;
        font-size: 10px;
        font-weight: 650;
      }

      .mock-thread {
        display: flex;
        min-height: 0;
        flex: 1;
        flex-direction: column;
        gap: 12px;
        padding: 17px;
      }

      .mock-bubble {
        max-width: 90%;
        padding: 10px 12px;
        font-size: 11px;
        line-height: 1.55;
        border-radius: 13px;
      }

      .mock-bubble.user {
        align-self: flex-end;
        color: #fff;
        border-bottom-right-radius: 4px;
        background: #4f46e5;
      }

      .mock-bubble.assistant {
        color: #334155;
        border: 1px solid #e2e8f0;
        border-bottom-left-radius: 4px;
        background: #f8fafc;
      }

      .mock-bubble strong {
        display: block;
        margin-bottom: 5px;
        color: #172554;
      }

      .mock-bubble ul {
        margin: 5px 0 0;
        padding-left: 15px;
      }

      .mock-activity {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .mock-activity span {
        padding: 5px 8px;
        color: #475569;
        font-size: 10px;
        border: 1px solid #dbe4ed;
        border-radius: 999px;
        background: #f8fafc;
      }

      .mock-code {
        margin-top: 7px;
        padding: 9px;
        color: #c7d2fe;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 9px;
        line-height: 1.55;
        white-space: pre-wrap;
        border-radius: 9px;
        background: #172033;
      }

      .mock-confirm-card {
        padding: 13px;
        color: #78350f;
        font-size: 10px;
        line-height: 1.5;
        border: 1px solid #fbbf24;
        border-radius: 14px;
        background: #fffbeb;
      }

      .mock-confirm-card strong {
        display: block;
        margin-bottom: 6px;
        font-size: 11px;
      }

      .mock-confirm-actions {
        display: flex;
        gap: 7px;
        margin-top: 10px;
      }

      .mock-confirm-actions span {
        padding: 6px 9px;
        color: #fff;
        font-weight: 700;
        border-radius: 8px;
        background: #059669;
      }

      .mock-confirm-actions span:last-child {
        color: #475569;
        border: 1px solid #cbd5e1;
        background: #fff;
      }

      .mock-privacy-card {
        padding: 12px;
        color: #334155;
        font-size: 10px;
        line-height: 1.52;
        border: 1px solid #dbe4f0;
        border-radius: 13px;
        background: #f8fafc;
      }

      .mock-privacy-card strong {
        display: block;
        margin-bottom: 5px;
        color: #172554;
        font-size: 11px;
      }

      .mock-privacy-card.provider {
        border-color: #c4b5fd;
        background: #f5f3ff;
      }

      .mock-attachment {
        display: grid;
        grid-template-columns: 36px 1fr;
        gap: 10px;
        align-items: center;
        padding: 10px 12px;
        color: #312e81;
        font-size: 10px;
        border: 1px solid #c7d2fe;
        border-radius: 13px;
        background: #eef2ff;
      }

      .mock-attachment b {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        color: #fff;
        font-size: 9px;
        border-radius: 9px;
        background: #4f46e5;
      }

      .mock-attachment strong,
      .mock-attachment small {
        display: block;
      }

      .mock-attachment small,
      .mock-privacy-hint {
        color: #64748b;
        font-size: 9px;
      }

      .mock-composer {
        margin: 0 14px 14px;
        padding: 10px 12px;
        color: #94a3b8;
        font-size: 10px;
        border: 1px solid #dbe2ea;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 6px 18px rgb(15 23 42 / 6%);
      }

      .promo {
        position: relative;
        width: 440px;
        height: 280px;
        overflow: hidden;
        background:
          radial-gradient(circle at 80% 13%, rgb(77 157 255 / 35%), transparent 34%),
          radial-gradient(circle at 6% 94%, rgb(28 214 176 / 20%), transparent 29%),
          linear-gradient(145deg, #07142f 0%, #0b2c5e 66%, #104276 100%);
      }

      .promo::before {
        position: absolute;
        inset: 0;
        content: "";
        background-image:
          linear-gradient(rgb(255 255 255 / 4%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / 4%) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: linear-gradient(135deg, black, transparent 78%);
      }

      .promo-brand {
        position: absolute;
        z-index: 3;
        top: 30px;
        left: 32px;
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 25px;
        font-weight: 760;
        letter-spacing: -0.03em;
      }

      .promo-brand img {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgb(0 0 0 / 34%);
      }

      .promo-tagline {
        position: absolute;
        z-index: 3;
        top: 91px;
        left: 33px;
        width: 170px;
        color: #d8e8ff;
        font-size: 16px;
        font-weight: 650;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }

      .mini-window {
        position: absolute;
        right: -14px;
        bottom: -26px;
        width: 330px;
        height: 205px;
        overflow: hidden;
        transform: rotate(-4deg);
        border: 1px solid rgb(221 235 255 / 45%);
        border-radius: 16px;
        background: #f3f7fb;
        box-shadow: 0 20px 55px rgb(0 2 16 / 45%);
      }

      .mini-toolbar {
        display: flex;
        gap: 5px;
        align-items: center;
        height: 28px;
        padding: 0 12px;
        border-bottom: 1px solid #dce6f1;
        background: #eaf1f8;
      }

      .mini-toolbar span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #91a6bc;
      }

      .mini-page {
        position: absolute;
        inset: 28px 124px 0 0;
        padding: 20px 18px;
        background:
          linear-gradient(115deg, rgb(224 245 240 / 80%), transparent 42%),
          #fffdf9;
      }

      .mini-page::before,
      .mini-page::after {
        display: block;
        content: "";
        border-radius: 999px;
        background: #153253;
      }

      .mini-page::before {
        width: 132px;
        height: 13px;
        margin-bottom: 13px;
      }

      .mini-page::after {
        width: 105px;
        height: 7px;
        opacity: 0.22;
        box-shadow: 0 17px 0 #153253, 0 34px 0 #153253;
      }

      .mini-panel {
        position: absolute;
        inset: 28px 0 0 auto;
        width: 124px;
        padding: 15px 13px;
        border-left: 1px solid #dce6f1;
        background: #ffffff;
      }

      .mini-panel::before {
        display: block;
        width: 67px;
        height: 8px;
        margin-bottom: 17px;
        content: "";
        border-radius: 999px;
        background: #102b4d;
      }

      .bubble {
        height: 44px;
        margin-bottom: 10px;
        border: 1px solid #d8e4f1;
        border-radius: 9px;
        background:
          linear-gradient(#7990a9 0 0) 9px 10px / 77px 5px no-repeat,
          linear-gradient(#aebdca 0 0) 9px 22px / 59px 5px no-repeat,
          #f7fafd;
      }

      .bubble.accent {
        height: 61px;
        border-color: #a8c9f0;
        background:
          linear-gradient(#176bba 0 0) 9px 10px / 64px 5px no-repeat,
          linear-gradient(#8ba5bc 0 0) 9px 22px / 78px 5px no-repeat,
          linear-gradient(#8ba5bc 0 0) 9px 34px / 51px 5px no-repeat,
          #eaf4ff;
      }

      .shield {
        position: absolute;
        z-index: 4;
        right: 23px;
        bottom: 24px;
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        color: #06385c;
        font-size: 27px;
        font-weight: 900;
        border: 3px solid rgb(255 255 255 / 88%);
        border-radius: 15px;
        background: #5ee0be;
        box-shadow: 0 12px 30px rgb(0 14 38 / 34%);
      }
    </style>
  </head>
  <body>
    <main id="asset"></main>
    <script>
      const params = new URLSearchParams(location.search);
      const locale = params.get("locale") === "zh-CN" ? "zh-CN" : "en";
      const scene = params.get("scene") || "summary";
      const kind = params.get("kind") || "screenshot";

      const copy = {
        en: {
          summary: [
            "Understand any page",
            "Summaries and answers grounded in the page",
            "01-summary.png",
          ],
          evidence: [
            "See the evidence",
            "Inspect DOM, styles, scripts, and computed behavior",
            "02-evidence.png",
          ],
          confirm: [
            "You stay in control",
            "The first write each turn asks for approval",
            "03-confirm.png",
          ],
          attachments: [
            "Ask across pages and files",
            "Attach text, images, and PDFs to the current request",
            "screenshot-04-attachments.png",
          ],
        },
        "zh-CN": {
          summary: [
            "快速理解任意网页",
            "基于当前页面生成总结与回答",
            "01-summary.png",
          ],
          evidence: [
            "回答有据可查",
            "检查 DOM、样式、脚本与实际行为",
            "02-evidence.png",
          ],
          confirm: [
            "修改前由你确认",
            "每轮第一次写操作先展示内容，再等待批准",
            "03-confirm.png",
          ],
          attachments: [
            "结合网页与文件提问",
            "附加文本、图片或 PDF，与当前页面一起分析",
            "screenshot-04-attachments.png",
          ],
        },
      };

      const icon = "../docs/store-assets/icon-128.png";
      const root = document.querySelector("#asset");

      const screenCopy = {
        en: {
          pageKicker: "CONTROLLED WORKSPACE",
          pageTitle: "Focus on the work that matters",
          pageLede:
            "A calm project workspace with milestones, evidence, and next steps in one place.",
          cards: [
            ["Milestones", "Turn broad goals into small, visible outcomes."],
            ["Evidence", "Keep decisions grounded in the current page."],
            ["Momentum", "See what is finished and what comes next."],
          ],
          progress: ["Launch readiness", "72% complete"],
          panelLabel: "Current page",
          composer: "Ask about this page…",
          summary: {
            user: "Summarize this page",
            title: "Here’s the page in brief",
            bullets: [
              "A focused workspace for planning and delivery.",
              "Three principles: milestones, evidence, and momentum.",
              "Launch readiness is currently at 72%.",
            ],
          },
          evidence: {
            user: "How is the progress animation implemented?",
            activity: ["Read page", "Inspect DOM", "Check computed style"],
            title: "The bar uses a pseudo-element",
            body: "The visible fill is generated by ::after and its width controls progress.",
            code: ".progress-track::after {\n  width: 72%;\n  background: linear-gradient(90deg, #22d3ee, #8b5cf6);\n}",
          },
          confirm: {
            user: "Hide the announcement banner",
            title: "🔒 Please confirm before modifying the page",
            body: "Set .announcement to display: none.",
            approve: "Approve this turn",
            deny: "Deny",
            hint: "Once approved, further write actions this turn run automatically without asking again.",
          },
          attachments: {
            user: "Summarize the attached launch brief",
            file: "launch-brief.pdf",
            status: "12 pages · ready",
            title: "The brief is ready to review",
            body: "PDF text was extracted locally. Key milestones, risks, and next steps are summarized.",
            privacy: "🔒 Sent to your configured provider when you send",
          },
        },
        "zh-CN": {
          pageKicker: "可控工作区",
          pageTitle: "专注于真正重要的工作",
          pageLede: "在一个清晰的工作区里查看里程碑、依据和下一步。",
          cards: [
            ["里程碑", "把宽泛目标拆成小而清晰的成果。"],
            ["依据", "让决策基于当前网页中的真实信息。"],
            ["进展", "随时了解已完成内容与下一步。"],
          ],
          progress: ["发布准备度", "已完成 72%"],
          panelLabel: "当前网页",
          composer: "询问当前网页…",
          summary: {
            user: "总结这个网页",
            title: "网页内容概览",
            bullets: [
              "这是一个用于规划与交付的专注工作区。",
              "三个核心：里程碑、依据和进展。",
              "当前发布准备度为 72%。",
            ],
          },
          evidence: {
            user: "进度动画是如何实现的？",
            activity: ["读取网页", "检查 DOM", "检查计算样式"],
            title: "进度条由伪元素生成",
            body: "可见填充来自 ::after，其宽度用于控制进度。",
            code: ".progress-track::after {\n  width: 72%;\n  background: linear-gradient(90deg, #22d3ee, #8b5cf6);\n}",
          },
          confirm: {
            user: "隐藏公告横幅",
            title: "🔒 修改网页前请确认",
            body: "把 .announcement 设置为 display: none。",
            approve: "批准本轮操作",
            deny: "拒绝",
            hint: "批准后，本轮内后续的写操作会自动执行，无需逐条确认。",
          },
          attachments: {
            user: "总结附件中的发布简报",
            file: "launch-brief.pdf",
            status: "12 页 · 已就绪",
            title: "发布简报已整理完成",
            body: "PDF 文本已在本地提取。已汇总关键里程碑、风险与下一步。",
            privacy: "🔒 发送时会传给你配置的 AI Provider",
          },
        },
      };

      const pageMarkup = (text) => {
        return `
          <p class="mock-kicker">${text.pageKicker}</p>
          <h2>${text.pageTitle}</h2>
          <p class="mock-page-lede">${text.pageLede}</p>
          <div class="mock-cards">
            ${text.cards
              .map(([title, body]) => `<div class="mock-card"><strong>${title}</strong><span>${body}</span></div>`)
              .join("")}
          </div>
          <div class="mock-progress">
            <div class="mock-progress-row"><span>${text.progress[0]}</span><span>${text.progress[1]}</span></div>
            <div class="mock-progress-track"></div>
          </div>
        `;
      };

      const threadMarkup = (text, selectedScene) => {
        if (selectedScene === "evidence") {
          return `
            <div class="mock-bubble user">${text.evidence.user}</div>
            <div class="mock-activity">${text.evidence.activity.map((item) => `<span>✓ ${item}</span>`).join("")}</div>
            <div class="mock-bubble assistant">
              <strong>${text.evidence.title}</strong>
              ${text.evidence.body}
              <div class="mock-code">${text.evidence.code}</div>
            </div>
          `;
        }

        if (selectedScene === "confirm") {
          return `
            <div class="mock-bubble user">${text.confirm.user}</div>
            <div class="mock-confirm-card">
              <strong>${text.confirm.title}</strong>
              <div>${text.confirm.body}</div>
              <div class="mock-confirm-actions"><span>${text.confirm.approve}</span><span>${text.confirm.deny}</span></div>
              <div style="margin-top: 9px; color: #92400e">${text.confirm.hint}</div>
            </div>
          `;
        }

        if (selectedScene === "attachments") {
          return `
            <div class="mock-bubble user">${text.attachments.user}</div>
            <div class="mock-attachment">
              <b>PDF</b>
              <span><strong>${text.attachments.file}</strong><small>${text.attachments.status}</small></span>
            </div>
            <div class="mock-bubble assistant">
              <strong>${text.attachments.title}</strong>
              ${text.attachments.body}
            </div>
            <div class="mock-privacy-hint">${text.attachments.privacy}</div>
          `;
        }

        return `
          <div class="mock-bubble user">${text.summary.user}</div>
          <div class="mock-bubble assistant">
            <strong>${text.summary.title}</strong>
            <ul>${text.summary.bullets.map((item) => `<li>${item}</li>`).join("")}</ul>
          </div>
        `;
      };

      if (kind === "promo") {
        document.documentElement.lang = locale;
        root.innerHTML = `
          <section class="promo" aria-label="Runi small promotional tile">
            <div class="promo-brand">
              <img src="${icon}" alt="" />
              <span>Runi</span>
            </div>
            <div class="promo-tagline">${locale === "zh-CN" ? "网页，如你所愿。" : "Your page, your way."}</div>
            <div class="mini-window" aria-hidden="true">
              <div class="mini-toolbar"><span></span><span></span><span></span></div>
              <div class="mini-page"></div>
              <div class="mini-panel">
                <div class="bubble"></div>
                <div class="bubble accent"></div>
              </div>
            </div>
            <div class="shield" aria-hidden="true">✓</div>
          </section>
        `;
      } else {
        document.documentElement.lang = locale;
        const [headline, subtitle] = copy[locale][scene] || copy[locale].summary;
        const text = screenCopy[locale];
        root.innerHTML = `
          <section class="shot">
            <div class="brand">
              <img src="${icon}" alt="" />
              <span>Runi</span>
            </div>
            <div class="copy">
              <h1>${headline}</h1>
              <p class="subtitle">${subtitle}</p>
            </div>
            <figure class="capture">
              <div class="mock-browser">
                <div class="mock-toolbar">
                  <i></i><i></i><i></i>
                  <span class="mock-address">runi.local/workspace</span>
                </div>
                <div class="mock-content">
                  <section class="mock-page">${pageMarkup(text)}</section>
                  <aside class="mock-panel">
                    <header class="mock-panel-header">
                      <img src="${icon}" alt="" />
                      <span>Runi</span>
                      <small>${text.panelLabel}</small>
                    </header>
                    <div class="mock-thread">${threadMarkup(text, scene)}</div>
                    <div class="mock-composer">＋&nbsp;&nbsp;${text.composer}</div>
                  </aside>
                </div>
              </div>
            </figure>
          </section>
        `;
      }
    </script>
  </body>
</html>

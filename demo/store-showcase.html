<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Documentation workspace</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172023;
      --muted: #607075;
      --paper: #f6f7f2;
      --surface: #ffffff;
      --line: #dfe5df;
      --accent: #0e766e;
      --accent-soft: #dff3ee;
      --warm: #ee7d52;
      --shadow: 0 18px 60px rgb(25 49 48 / 10%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 8% 4%, rgb(238 125 82 / 13%), transparent 28rem),
        linear-gradient(180deg, #fbfcf8 0, var(--paper) 100%);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    button {
      font: inherit;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 32px;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 14px;
      font-weight: 760;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .wordmark-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      background: var(--ink);
      color: white;
      font-size: 12px;
    }

    .locale-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgb(255 255 255 / 72%);
      color: var(--muted);
      padding: 8px 13px;
      font-size: 12px;
      font-weight: 650;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 32px;
      width: min(1120px, calc(100% - 48px));
      margin: 28px auto 80px;
    }

    .document {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: rgb(255 255 255 / 92%);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 58px 64px 46px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(120deg, rgb(14 118 110 / 11%), transparent 56%),
        var(--surface);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 22px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 780;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 24px;
      height: 2px;
      background: currentColor;
      content: "";
    }

    h1 {
      max-width: 700px;
      margin: 0;
      font-size: clamp(38px, 6vw, 68px);
      font-weight: 760;
      letter-spacing: -0.055em;
      line-height: 0.98;
    }

    .dek {
      max-width: 650px;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.72;
    }

    .article-body {
      padding: 46px 64px 64px;
    }

    .article-body h2 {
      margin: 0 0 14px;
      font-size: 25px;
      letter-spacing: -0.025em;
    }

    .article-body p {
      margin: 0;
      color: #46565a;
      font-size: 16px;
      line-height: 1.82;
    }

    .article-body section + section,
    .article-body article + section {
      margin-top: 42px;
      padding-top: 42px;
      border-top: 1px solid var(--line);
    }

    .step-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 24px;
    }

    .step {
      min-height: 148px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: #fbfcfa;
    }

    .step-number {
      display: block;
      margin-bottom: 25px;
      color: var(--warm);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .step strong {
      display: block;
      margin-bottom: 7px;
      font-size: 15px;
    }

    .step span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .progress-card {
      position: relative;
      overflow: hidden;
      margin-top: 24px;
      padding: 25px;
      border-radius: 20px;
      background: #172c2e;
      color: white;
    }

    .progress-card::after {
      position: absolute;
      top: -62px;
      right: -44px;
      width: 170px;
      height: 170px;
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 50%;
      content: "";
    }

    .progress-meta {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .progress-label {
      display: block;
      color: #bcd5d2;
      font-size: 12px;
      font-weight: 720;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .progress-status {
      margin-top: 6px;
      font-size: 19px;
      font-weight: 720;
    }

    .progress-value {
      color: #a7e4d8;
      font-size: 28px;
      font-weight: 780;
      letter-spacing: -0.04em;
    }

    .progress-track {
      position: relative;
      z-index: 1;
      overflow: hidden;
      height: 9px;
      border-radius: 999px;
      background: rgb(255 255 255 / 13%);
    }

    .progress-fill {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6fd8c8, #ffd19d);
      transform: scaleX(0.18);
      transform-origin: left;
      animation: analyze-evidence 3.4s cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
    }

    @keyframes analyze-evidence {
      from {
        transform: scaleX(0.18);
      }
      to {
        transform: scaleX(0.86);
      }
    }

    .settings-panel {
      position: sticky;
      top: 24px;
      align-self: start;
      padding: 25px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgb(255 255 255 / 88%);
      box-shadow: 0 14px 44px rgb(25 49 48 / 7%);
      backdrop-filter: blur(14px);
    }

    .settings-panel h2 {
      margin: 0;
      font-size: 18px;
    }

    .settings-intro {
      margin: 9px 0 24px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 0;
      border-top: 1px solid var(--line);
      color: #46565a;
      font-size: 13px;
    }

    .swatches {
      display: flex;
      gap: 6px;
    }

    .swatch {
      width: 19px;
      height: 19px;
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 1px var(--line);
    }

    .swatch-teal {
      background: var(--accent);
    }

    .swatch-coral {
      background: var(--warm);
    }

    .line-width {
      width: 52px;
      height: 7px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent) 62%, var(--line) 62%);
    }

    #focus-mode-button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 12px;
      background: var(--ink);
      color: white;
      padding: 12px 16px;
      cursor: default;
      font-size: 13px;
      font-weight: 720;
    }

    .demo-note {
      margin: 14px 2px 0;
      color: #7d898c;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .settings-panel {
        position: static;
        grid-row: 1;
      }
    }

    @media (max-width: 620px) {
      .site-header {
        padding: 20px;
      }

      .layout {
        width: min(100% - 24px, 1120px);
        margin-top: 12px;
      }

      .hero,
      .article-body {
        padding: 34px 26px;
      }

      .step-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill {
        animation: none;
        transform: scaleX(0.72);
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wordmark">
      <span class="wordmark-mark" aria-hidden="true">FD</span>
      <span data-i18n="workspaceName"></span>
    </div>
    <span class="locale-pill" id="locale-label" data-i18n="localeLabel"></span>
  </header>

  <main class="layout">
    <article class="document">
      <header class="hero">
        <p class="eyebrow" data-i18n="articleLabel"></p>
        <h1 data-i18n="pageTitle"></h1>
        <p class="dek" data-i18n="pageDescription"></p>
      </header>

      <div class="article-body">
        <section id="project-overview">
          <h2 data-i18n="overviewTitle"></h2>
          <p data-i18n="overviewBody"></p>
          <div class="step-grid">
            <div class="step">
              <span class="step-number">01</span>
              <strong data-i18n="stepOneTitle"></strong>
              <span data-i18n="stepOneBody"></span>
            </div>
            <div class="step">
              <span class="step-number">02</span>
              <strong data-i18n="stepTwoTitle"></strong>
              <span data-i18n="stepTwoBody"></span>
            </div>
            <div class="step">
              <span class="step-number">03</span>
              <strong data-i18n="stepThreeTitle"></strong>
              <span data-i18n="stepThreeBody"></span>
            </div>
          </div>
        </section>

        <article id="implementation-notes">
          <h2 data-i18n="implementationTitle"></h2>
          <p data-i18n="implementationBody"></p>
          <div class="progress-card" id="animated-progress-card">
            <div class="progress-meta">
              <div>
                <span class="progress-label" data-i18n="progressLabel"></span>
                <div class="progress-status" data-i18n="progressStatus"></div>
              </div>
              <span class="progress-value">86%</span>
            </div>
            <div class="progress-track" aria-hidden="true">
              <span class="progress-fill"></span>
            </div>
          </div>
        </article>

        <section id="review-checklist">
          <h2 data-i18n="reviewTitle"></h2>
          <p data-i18n="reviewBody"></p>
        </section>
      </div>
    </article>

    <section class="settings-panel" id="workspace-settings">
      <h2 data-i18n="settingsTitle"></h2>
      <p class="settings-intro" data-i18n="settingsBody"></p>
      <div class="setting-row">
        <span data-i18n="accentLabel"></span>
        <span class="swatches" aria-hidden="true">
          <span class="swatch swatch-teal"></span>
          <span class="swatch swatch-coral"></span>
        </span>
      </div>
      <div class="setting-row">
        <span data-i18n="lineWidthLabel"></span>
        <span class="line-width" aria-hidden="true"></span>
      </div>
      <button id="focus-mode-button" type="button" data-i18n="focusMode"></button>
      <p class="demo-note" data-i18n="demoNote"></p>
    </section>
  </main>

  <script>
    const locale = new URLSearchParams(location.search).get('lang') === 'zh-CN' ? 'zh-CN' : 'en';
    const copy = {
      en: {
        workspaceName: 'Field documentation',
        localeLabel: 'English demo',
        articleLabel: 'Fictional documentation article',
        pageTitle: 'Building a reliable evidence review flow',
        pageDescription: 'A concise guide to collecting, checking, and presenting implementation evidence without losing the thread of the work.',
        overviewTitle: 'Review workflow',
        overviewBody: 'The workflow separates collection from interpretation. Each piece of evidence receives a stable label, a short observation, and a review status before it enters the final brief.',
        stepOneTitle: 'Collect',
        stepOneBody: 'Gather only material tied to the review question.',
        stepTwoTitle: 'Compare',
        stepTwoBody: 'Check each observation against the implementation.',
        stepThreeTitle: 'Present',
        stepThreeBody: 'Group verified findings into a readable brief.',
        implementationTitle: 'Implementation notes',
        implementationBody: 'The progress card uses a CSS keyframe and a transform-based fill.',
        progressLabel: 'Evidence analysis',
        progressStatus: 'Comparing implementation notes',
        reviewTitle: 'Completion criteria',
        reviewBody: 'The review is complete when every finding can be traced to controlled evidence, the open questions are explicit, and the final presentation contains no unrelated account or profile information.',
        settingsTitle: 'Workspace settings',
        settingsBody: 'A controlled panel for demonstrating page restyling.',
        accentLabel: 'Accent pair',
        lineWidthLabel: 'Reading width',
        focusMode: 'Enable focus mode',
        demoNote: 'This button is a stable interaction target for the demo.',
      },
      'zh-CN': {
        workspaceName: '现场文档',
        localeLabel: '中文演示',
        articleLabel: '虚构产品文档文章',
        pageTitle: '构建可靠的证据审阅流程',
        pageDescription: '这份简明指南介绍如何收集、核对并呈现实现证据，同时保持工作脉络清晰。',
        overviewTitle: '审阅流程',
        overviewBody: '这套流程将素材收集与结论判断分开。每条证据在进入最终简报前，都会获得稳定标签、简短观察和审阅状态。',
        stepOneTitle: '收集',
        stepOneBody: '只收集与审阅问题直接相关的材料。',
        stepTwoTitle: '核对',
        stepTwoBody: '将每项观察与实际实现逐一核对。',
        stepThreeTitle: '呈现',
        stepThreeBody: '把已验证的发现整理成易读简报。',
        implementationTitle: '实现说明',

        progressLabel: '证据分析',
        progressStatus: '正在核对实现说明',
        reviewTitle: '完成标准',
        reviewBody: '当每项发现都能追溯到受控证据、待确认问题清晰列出，并且最终呈现不包含无关账号或个人资料信息时，审阅即可完成。',
        settingsTitle: '工作区设置',
        settingsBody: '这是用于演示页面样式调整的受控面板。',
        accentLabel: '强调色组合',

        focusMode: '开启专注模式',
        demoNote: '此按钮是演示流程中的稳定交互目标。',
      },
    };

    document.documentElement.lang = locale;
    document.title = copy[locale].pageTitle;
    document.querySelectorAll('[data-i18n]').forEach((element) => {
      element.textContent = copy[locale][element.dataset.i18n];
    });
  </script>
</body>
</html>

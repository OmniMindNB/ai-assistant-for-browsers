---
title: Runi
---
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{ page.title }}</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --foreground: #1b1d22;
        --muted: #5f6672;
        --border: #dfe3e8;
        --link: #275ea8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #15171b;
          --foreground: #eef0f3;
          --muted: #abb2bd;
          --border: #343942;
          --link: #8abcf0;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        line-height: 1.7;
      }
      main {
        width: min(100%, 36rem);
        margin: 0 auto;
        padding: 4rem 1.25rem;
        text-align: center;
      }
      h1 { margin: 0 0 0.5rem; font-size: clamp(1.6rem, 6vw, 2.1rem); }
      p { color: var(--muted); margin: 0 0 2rem; }
      ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.75rem; }
      a {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        color: var(--link);
        text-decoration: none;
      }
      a:hover { background: var(--border); }
    </style>
  </head>
  <body>
    <main>
      <h1>Runi</h1>
      <p>浏览器扩展法律文档 · Legal documents for the Runi browser extension</p>
      <ul>
        <li><a href="{{ '/privacy-policy/zh-CN/' | relative_url }}">隐私政策（中文）</a></li>
        <li><a href="{{ '/privacy-policy/' | relative_url }}">Privacy Policy (English)</a></li>
      </ul>
    </main>
  </body>
</html>

<!doctype html>
<html lang="{{ page.lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{ page.title }}</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --foreground: #1b1d22;
        --muted: #5f6672;
        --border: #dfe3e8;
        --surface: #f4f6f8;
        --link: #275ea8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #15171b;
          --foreground: #eef0f3;
          --muted: #abb2bd;
          --border: #343942;
          --surface: #20242a;
          --link: #8abcf0;
        }
      }
      * { box-sizing: border-box; }
      html { overflow-wrap: anywhere; }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        line-height: 1.7;
      }
      main {
        width: min(100%, 52rem);
        margin: 0 auto;
        padding: 2rem 1.25rem 5rem;
      }
      nav { margin-bottom: 2rem; color: var(--muted); text-align: right; }
      h1 { margin: 0 0 0.35rem; font-size: clamp(1.8rem, 6vw, 2.35rem); line-height: 1.2; }
      h2 {
        margin: 2.5rem 0 0.75rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
        font-size: 1.25rem;
        line-height: 1.35;
      }
      p, ul { margin: 0.8rem 0; }
      ul { padding-left: 1.4rem; }
      table {
        display: block;
        width: 100%;
        margin: 1rem 0;
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        border-collapse: collapse;
        font-size: 0.92rem;
      }
      th, td {
        min-width: 10rem;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--border);
        text-align: left;
        vertical-align: top;
      }
      th { background: var(--surface); }
      code {
        padding: 0.1rem 0.35rem;
        border-radius: 0.25rem;
        background: var(--surface);
        font-size: 0.9em;
      }
      pre { max-width: 100%; overflow-x: auto; }
      a { color: var(--link); }
      @media (max-width: 36rem) {
        main { padding-top: 1.25rem; }
        nav { margin-bottom: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="{{ page.language_navigation_label }}">
        {% if page.lang == "en" %}
          <strong>{{ page.current_language_label }}</strong> ·
          <a href="{{ page.alternate_path | relative_url }}" lang="zh-CN">{{ page.alternate_label }}</a>
        {% else %}
          <a href="{{ page.alternate_path | relative_url }}" lang="en">{{ page.alternate_label }}</a> ·
          <strong>{{ page.current_language_label }}</strong>
        {% endif %}
      </nav>
      <article>{{ content }}</article>
    </main>
  </body>
</html>
